name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      # Node 22 matches the node:22-slim base image in the Dockerfile, so CI catches
      # anything that would break in the container. Node only hosts the Prisma CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # Pinned to the same version the Dockerfile lifts the binary from, because the
      # tests exercise Bun-specific APIs (HTMLRewriter, Bun.sleep, bun:test).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile
      # Prisma 7 no longer generates on install, and nothing typechecks without it.
      - run: pnpm run generate
      - run: pnpm run typecheck
      - run: pnpm run format:check
      # Pure units only — no database, no network. See src/**/*.test.ts.
      # The script blanks DATABASE_URL because `bun test` auto-loads the repo .env,
      # so a test that reaches src/prisma.ts passes locally and only fails here.
      - run: pnpm run test

  # The Dockerfile is the only thing that proves the deploy still assembles, and it
  # can't be built on the maintainer's machine. CI is the only place this runs.
  image:
    runs-on: ubuntu-latest
    # A red typecheck or a failing test should not burn a full buildx run.
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mangobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches a broken CMD or a missing runtime binary, which a successful
      # build alone would not.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint sh mangobot:ci -c '
            set -e
            bun --version
            command -v pnpm
            test -x ./start.sh
            head -c 2 ./start.sh | grep -q "#!"
            pnpm exec prisma --version
          '
