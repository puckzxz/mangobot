# Local development stack. Production runs the same image against an external
# Postgres, so the `db` service here is for local use only.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # The catalog web UI (no auth — private-network deployment).
      - "3000:3000"
    env_file:
      - .env
    restart: always
    # A pass takes ~80s and the shutdown handler waits for it to finish, so that a
    # SIGKILL cannot land between a successful send and the row update and
    # re-announce the chapter on restart. Docker's default grace is 10s.
    stop_grace_period: 180s
    # Observability only: Compose outside Swarm does not restart an unhealthy
    # container, it just reports it.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # cap_add: SYS_ADMIN used to be here for Chrome's sandbox. There is no browser
    # any more, and it granted mount/namespace powers to a process that spent its
    # time parsing third-party HTML.

  db:
    image: postgres:15.3
    restart: always
    ports:
      # Bound to loopback: this was published on 0.0.0.0 with the password below,
      # which put a Postgres instance on every interface of the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mangobot
      POSTGRES_DB: postgres
